[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "variant-lens"
version = "0.1.0"
description = "A command-line tool for rare Mendelian variant interpretation using semantic search over biomedical literature."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Sepideh Moafi"}
]
keywords = ["genomics", "variant-interpretation", "biomedical-nlp", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "typer>=0.9",
    "requests>=2.31",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
variant-lens = "variant_lens.cli:app"

[project.urls]
Homepage = "https://github.com/AIResearcher20/variant-lens"
Issues = "https://github.com/AIResearcher20/variant-lens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
