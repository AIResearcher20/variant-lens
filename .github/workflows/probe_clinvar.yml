name: Probe ClinVar

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e .

      - name: Run probe
        env:
          NCBI_TOOL: variant-lens
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: |
          python - <<'PY'
          from variant_lens.clinvar import fetch_clinvar_pmids
          from variant_lens.fetch import FetchError

          probes = [
              ("BRCA1", "c.68_69delAG"),
              ("TP53", "c.743G>A"),
              ("CFTR", "c.1521_1523delCTT"),
          ]

          for gene, hgvs in probes:
              query = f"{gene} {hgvs}"
              print(f"=== {query} ===")
              try:
                  result = fetch_clinvar_pmids(query)
              except FetchError as exc:
                  print(f"  FetchError: {exc}")
                  continue
              print(f"  ClinVar UIDs: {result['uids']}")
              print(f"  linked PMIDs: {result['pmids']}")
              print()
          PY
