name: Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/benchmark.py"
      - "src/variant_lens/retrieve/**"
      - "data/gold_standard/evidence/**"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-pubmedbert-v1
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Install project with retrieval extras
        run: pip install -e ".[retrieve]"

      - name: Run benchmark
        run: python scripts/benchmark.py --golden-set data/gold_standard/ --output evaluation_results.json

      - name: Show summary
        run: |
          echo "Results file:"
          ls -lh evaluation_results.json
          echo
          echo "Summary:"
          python - <<'PY'
          import json
          with open("evaluation_results.json") as f:
              data = json.load(f)
          meta = data["metadata"]
          print(f"eligible variants: {meta['eligible_size']}")
          print(f"corpus size: {meta['corpus_size']}")
          print(f"top_k: {meta['top_k']}")
          print()
          for name, entry in data["strategies"].items():
              s = entry["summary"]
              print(f"{name}:")
              print(f"  Recall@5  = {s['recall@5']:.3f}")
              print(f"  Recall@10 = {s['recall@10']:.3f}")
              print(f"  MRR       = {s['mrr']:.3f}")
              print(f"  nDCG@10   = {s['ndcg@10']:.3f}")
          PY

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation_results.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update benchmark results"
            git push
          fi
