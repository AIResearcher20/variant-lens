name: Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  benchmark:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run benchmark
        run: |
          python scripts/benchmark.py --golden-set data/gold_standard/ --output evaluation_results.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation_results.json
